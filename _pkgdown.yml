url: https://gillescolling.com/framedf
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes
  math-rendering: mathjax
  includes:
    in_header: |
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
figures:
  dev: svglite
  fig.ext: svg
  bg: '#F5F6F8'
home:
  title: 'framedf: First-Pass Triage of Unfamiliar Data Frames'
  description: |
    A first-pass diagnostic for data frames. Infers a semantic role for
    every column, screens all sensible pairs for relationships, and lists
    anomalies as qualitative sentences.
authors:
  Gilles Colling:
    href: https://github.com/gcol33
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    - news
    right:
    - search
    - github
    - lightswitch
  components:
    intro:
      text: Get started
      href: articles/quickstart.html
    github:
      icon: fab fa-github
      href: https://github.com/gcol33/framedf
      aria-label: GitHub
reference:
- title: Triage
  desc: Build a triage object from a data frame.
  contents:
  - triage
  - framedf_settings
- title: Reader functions
  desc: Inspect what `triage()` found.
  contents:
  - print.frame_df
  - relationships
  - anomalies
  - details
- title: Package
  contents: framedf-package
articles:
- title: Get started
  contents:
  - quickstart
- title: Practical guides
  navbar: Practical guides
  contents:
  - workflows
  - roles
footer:
  structure:
    left: developed_by
    right: built_with
